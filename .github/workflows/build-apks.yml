# Builds the Bingoor customer, rider and warehouse APKs.
# Every run keeps the APKs as a downloadable artifact for one day. A run on main also force-pushes them to
# the `apk-builds` branch and asks the server to publish them (deploy/docker-deploy.sh, "apks"),
# so https://api.bingoor.com/downloads/bingoor-<app>.apk always serves the latest build.
name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blinkit-app-/**
      - bingoor-backend/bingoor-mobile/**
      - bingoor-warehouse/**
      - .github/workflows/build-apks.yml
  # On a pull request the APKs are only built (and kept as artifacts), never published.
  pull_request:
    paths:
      - blinkit-app-/**
      - bingoor-backend/bingoor-mobile/**
      - bingoor-warehouse/**
      - .github/workflows/build-apks.yml

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: blinkit-app-
          - app: rider
            dir: bingoor-backend/bingoor-mobile
          - app: warehouse
            dir: bingoor-warehouse
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # GitHub-hosted runners are small and the Android build matrix can fill the disk quickly.
      # Remove large preinstalled tooling before Gradle compiles all three apps.
      - name: Free disk space
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules/@angular /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo apt-get clean || true
          sudo docker image prune -af > /dev/null || true
          echo "Disk after cleanup:"
          df -h /

      - name: npm install
        working-directory: ${{ matrix.dir }}
        run: npm install --no-audit --no-fund

      - name: gradlew assembleRelease
        working-directory: ${{ matrix.dir }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/bingoor-${{ matrix.app }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bingoor-${{ matrix.app }}
          path: bingoor-${{ matrix.app }}.apk
          # The publish job below picks these up within minutes, and the latest APKs also live on the
          # apk-builds branch and api.bingoor.com/downloads. A 30-day keep filled the repository's
          # artifact storage (3 APKs per run) and made every later run fail at this step.
          retention-days: 1

  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      # One commit, force-pushed, so old APKs do not pile up in the repository history.
      - name: Push the APKs to the apk-builds branch
        run: |
          ls -la bingoor-*.apk
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bingoor-*.apk
          git commit -qm "APKs from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds

      # Same key as deploy.yml. "apks" only copies the APKs: no rebuild, the sites stay up.
      - name: Publish them on api.bingoor.com/downloads
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::No deploy secrets: the APKs are on the apk-builds branch and are published on the next deploy."
            exit 0
          fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o ServerAliveInterval=30 "root@$DEPLOY_HOST" apks
