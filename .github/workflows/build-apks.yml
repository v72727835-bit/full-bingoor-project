# Builds the Bingoor customer, rider and warehouse APKs.
# A run on main force-pushes them to the `apk-builds` branch and asks the server to publish them
# (deploy/docker-deploy.sh, "apks"), so https://api.bingoor.com/downloads/bingoor-<app>.apk always
# serves the latest build. A pull-request run only builds them (kept as a one-day artifact).
#
# Runs on GitHub's own machines (ubuntu-latest); nothing runs on a local PC.
name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - blinkit-app-/**
      - bingoor-backend/bingoor-mobile/**
      - bingoor-warehouse/**
      - .github/workflows/build-apks.yml
  pull_request:
    paths:
      - blinkit-app-/**
      - bingoor-backend/bingoor-mobile/**
      - bingoor-warehouse/**
      - .github/workflows/build-apks.yml

concurrency:
  group: build-apks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      # GitHub's runners are small; three Android builds fill the disk without this.
      - name: Free disk space
        shell: bash
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          df -h /

      - name: npm install (all three apps)
        shell: bash
        run: |
          for dir in blinkit-app- bingoor-backend/bingoor-mobile bingoor-warehouse; do
            echo "::group::npm install $dir"
            (cd "$dir" && npm install --no-audit --no-fund)
            echo "::endgroup::"
          done

      - name: Build APKs
        shell: bash
        run: |
          set -e
          build() {
            (cd "$2/android" && chmod +x gradlew && ./gradlew assembleRelease --no-daemon --stacktrace)
            cp "$2/android/app/build/outputs/apk/release/app-release.apk" "$GITHUB_WORKSPACE/bingoor-$1.apk"
          }
          build customer blinkit-app-
          build rider bingoor-backend/bingoor-mobile
          build warehouse bingoor-warehouse

      - name: APK sizes
        shell: bash
        run: ls -la bingoor-*.apk

      # Pull requests: keep the APKs for a day to try them. A full artifact storage must not
      # fail the build (main publishes straight from this job, no artifact needed).
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        continue-on-error: true
        with:
          name: bingoor-apks
          path: bingoor-*.apk
          retention-days: 1

      # One commit, force-pushed, so old APKs do not pile up in the repository history.
      - name: Push the APKs to the apk-builds branch
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          out="$RUNNER_TEMP/apk-builds"
          rm -rf "$out" && mkdir -p "$out" && cp bingoor-*.apk "$out/"
          cd "$out"
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bingoor-*.apk
          git commit -qm "APKs from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-builds

      # Same key as deploy.yml. "apks" only copies the APKs: no rebuild, the sites stay up.
      # The key lives in the job's temp folder and is removed after.
      - name: Publish them on api.bingoor.com/downloads
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::No deploy secrets: the APKs are on the apk-builds branch and are published on the next deploy."
            exit 0
          fi
          d="$RUNNER_TEMP/ssh"
          mkdir -p "$d" && chmod 700 "$d"
          trap 'rm -rf "$d"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$d/deploy_key"
          chmod 600 "$d/deploy_key"
          ssh-keyscan -H "$DEPLOY_HOST" > "$d/known_hosts" 2>/dev/null
          ssh -i "$d/deploy_key" -o UserKnownHostsFile="$d/known_hosts" -o BatchMode=yes -o ServerAliveInterval=30 "root@$DEPLOY_HOST" apks
