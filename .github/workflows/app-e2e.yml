# Smoke test of the customer and rider apps on an Android emulator against a
# local API with demo data (never the live server). It signs in, taps through
# the main screens, and fails if the app crashes; screenshots and logcat are
# kept as an artifact. Run it from the Actions tab before shipping app changes.
# It runs on pull requests that change the apps, the API or the test, and by hand.
name: App smoke test (emulator)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - blinkit-app-/**
      - bingoor-backend/**
      - e2e/**
      - .github/workflows/app-e2e.yml

concurrency:
  group: app-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: customer
            dir: blinkit-app-
            pkg: com.bingoor.shop
          - app: rider
            dir: bingoor-backend/bingoor-mobile
            pkg: com.bingoor.delivery
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/bingoor_e2e
      JWT_ACCESS_SECRET: e2e-access-secret-0123456789
      JWT_REFRESH_SECRET: e2e-refresh-secret-0123456789
      PORT: '5000'
      NODE_ENV: development
    steps:
      # The runner's disk is too small for a React Native build plus an emulator image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules/@angular /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell
          sudo docker image prune -af > /dev/null || true
          df -h /
      - uses: actions/checkout@v4

      # Seconds, not half an hour: the UI driver must pass its own checks against
      # real emulator screen dumps before anything is built.
      - name: UI driver self-test
        run: python3 -m unittest e2e/test_ui.py -v

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Local API with demo data
        working-directory: bingoor-backend
        run: |
          npm install --no-audit --no-fund
          npm run seed
          nohup npx tsx src/server.ts > ../backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:5000/health > /dev/null && break; sleep 2; done
          npx tsx scripts/e2e-seed.ts
          echo "OTP=$(cat e2e-otp.txt)" >> "$GITHUB_ENV"

      - name: Point the app at the local API
        run: |
          sed -i "s#^const API_URL_OVERRIDE: string | null = .*#const API_URL_OVERRIDE: string | null = 'http://10.0.2.2:5000/api/v1';#" "${{ matrix.dir }}/src/config.ts"
          sed -i 's#android:usesCleartextTraffic="${usesCleartextTraffic}"#android:usesCleartextTraffic="true"#' "${{ matrix.dir }}/android/app/src/main/AndroidManifest.xml"
          grep -n "^const API_URL_OVERRIDE" "${{ matrix.dir }}/src/config.ts"

      - name: Build the APK
        working-directory: ${{ matrix.dir }}
        run: |
          npm install --no-audit --no-fund
          cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app.apk"
          # Make room for the emulator image.
          ./gradlew --stop || true
          cd .. && rm -rf android/app/build android/build android/.gradle node_modules ~/.gradle/caches/transforms-* ~/.gradle/caches/build-cache-*
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: UI driver
        run: pip install --quiet uiautomator2

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash e2e/run.sh ${{ matrix.pkg }} e2e/${{ matrix.app }}.flow

      - name: The delivery reached the API
        if: matrix.app == 'rider'
        run: |
          grep -E "POST /api/v1/rider/orders/[^ ]+/deliver" backend.log || true
          grep -qE "POST /api/v1/rider/orders/[^ ]+/deliver [^ ]*200" backend.log  # morgan colours the status code

      - if: always()
        run: cp backend.log e2e-out/ 2>/dev/null || true

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.app }}
          path: e2e-out
          retention-days: 7
