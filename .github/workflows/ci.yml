name: CI

# Runs on every pull request and every push to main. GitHub only executes
# workflows from the repository root, so this is the single source of CI for the
# monorepo (the per-folder .github/workflows are leftovers from when each app was
# its own repo and never run here).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Runner: see build-apks.yml (repository variable BINGOOR_RUNNER; default = the self-hosted Windows PC).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, build, tests)
    runs-on: ${{ fromJSON(vars.BINGOOR_RUNNER || '["self-hosted","windows","x64","bingoor"]') }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: bingoor-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The npm cache save hangs for ~10 min on the Windows runner; only GitHub's Linux machines use it.
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
          cache-dependency-path: bingoor-backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      # Integration tests spin up mongodb-memory-server (downloads a mongod binary).
      - run: npm run test:integration

  customer-app:
    name: Customer app (blinkit-app-) typecheck
    runs-on: ${{ fromJSON(vars.BINGOOR_RUNNER || '["self-hosted","windows","x64","bingoor"]') }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: blinkit-app-
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The npm cache save hangs for ~10 min on the Windows runner; only GitHub's Linux machines use it.
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
          cache-dependency-path: blinkit-app-/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  rider-app:
    name: Rider app (bingoor-mobile) typecheck
    runs-on: ${{ fromJSON(vars.BINGOOR_RUNNER || '["self-hosted","windows","x64","bingoor"]') }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: bingoor-backend/bingoor-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The npm cache save hangs for ~10 min on the Windows runner; only GitHub's Linux machines use it.
          cache: ${{ runner.os == 'Linux' && 'npm' || '' }}
          cache-dependency-path: bingoor-backend/bingoor-mobile/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
